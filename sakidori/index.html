<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>SAKIDORI</title>
<meta name="apple-mobile-web-app-title" content="SAKIDORI">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F4F1E8">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Murecho:wght@600&family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light}
html,body{margin:0;background:#F4F1E8;color:#3A382C;font-family:'BIZ UDPGothic',system-ui,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:420px;margin:0 auto;padding:48px 24px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
img{width:96px;height:96px;border-radius:22px}
h1{font-family:Murecho,sans-serif;font-weight:600;font-size:26px;letter-spacing:.08em;color:#2B2A20;margin:0}
a.go{display:flex;align-items:center;justify-content:center;width:100%;height:56px;border-radius:999px;background:#4C6620;color:#fff;font-size:17px;font-weight:700;text-decoration:none}
.note{font-size:13px;line-height:1.7;color:#67634F}
.card{background:#FFFDF8;border:1px solid #E1DBCB;border-radius:16px;padding:14px 16px;text-align:left;width:100%;box-sizing:border-box}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <img src="icon-180.png" alt="">
  <h1>SAKIDORI</h1>
  <a class="go" id="go" href="#" hidden>開く</a>
  <div class="card note" id="how" hidden>iPhone：Safari の共有ボタン →「ホーム画面に追加」→「追加」。次からはアイコンを押すだけで開きます。</div>
  <div class="card note" id="nokey" hidden>家族に届いたリンクから開いてください。</div>
</main>
<script>
// 本体（Apps Script のウェブアプリ）。URL が変わったらこの1行を直す
var APP = 'https://script.google.com/macros/s/AKfycbxZNMyIhQut-WviwFlxj5SsBEmEDz5w5kgK7twQGaZTWpNoHcqt8aiZECl7iPOEAV_AJQ/exec';
// 合言葉は # の後ろ（サーバーに送られない）。このページには書かない
var m = location.hash.match(/(?:^#|&)k=([A-Za-z0-9]+)/);
var k = m ? m[1] : '';
if (!k) {
  document.getElementById('nokey').hidden = false;
} else {
  var url = APP + '?k=' + k;
  var go = document.getElementById('go');
  go.href = url; go.hidden = false;
  if (/(?:^\?|&)open=1(?:&|$)/.test(location.search)) {
    location.replace(url);
  } else {
    document.getElementById('how').hidden = false;
    // ホーム画面に置いたアイコンからは、すぐ本体へ移る
    try { history.replaceState(null, '', location.pathname + '?open=1' + location.hash); } catch (e) {}
  }
}
</script>
</body>
</html>
